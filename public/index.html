<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>¡Chapa la Bandera! · Perú Party</title>
  <meta name="description" content="Juego de plataformas multijugador (hasta 8) al estilo party: pon trampas peruanas y chapa la bandera del Perú primero.">
  <meta name="theme-color" content="#1b1426">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' shape-rendering='crispEdges'><rect width='12' height='8' fill='%23d62828'/><rect x='4' width='4' height='8' fill='%23f4f1ea'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hud hidden">
    <div class="hud-top">
      <div class="hud-left"><span id="ph"></span><small id="round"></small></div>
      <div id="timer" class="timer">0</div>
      <div id="board" class="board"></div>
    </div>
  </div>
  <div id="power" class="power hidden"></div>
  <div id="keys" class="keys hidden"></div>
  <button id="keys-chip" class="keys-chip hidden" title="Mostrar u ocultar los controles">⌨ H · controles</button>
  <div id="banner" class="banner"></div>
  <div id="toast" class="toasts" aria-live="polite"></div>
  <div id="status" class="status hidden"></div>

  <div id="touch" class="touch hidden">
    <div id="t-pad" class="pad" aria-label="Moverse"><span class="half" data-dir="-1">◀</span><span class="half" data-dir="1">▶</span></div>
    <div class="tr"><button id="t-power" aria-label="Poder">⚡</button><button id="t-jump" aria-label="Saltar">▲</button></div>
  </div>
  <button id="t-rot" class="rotbtn hidden">↻ Girar</button>
  <button id="t-place" class="placebtn hidden">✓ Colocar</button>

  <div id="screen" class="screen"></div>

  <div id="rotar" class="rotar">
    <div class="rotar-box">
      <div class="rotar-ico">📱</div>
      <p>Gira tu celular para jugar mejor</p>
      <button id="rotar-full" class="btn">⛶ Pantalla completa</button>
      <button id="rotar-ok" class="link">Seguir en vertical</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="art.js"></script>
  <script src="scenery.js"></script>
  <script src="game.js"></script>
</body>
</html>
